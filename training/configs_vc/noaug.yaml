exp_name: ceb_noaug
output_dir: ./outputs/
seed: 42
data:
  sampling_rate: 16000
  label_map:
    bonafide: 1
    spoof: 0
  train:
    dataset_type: StandardDataset
    dataset_names:
    - ceb_pld
    parquet_files:
    - manifests/splits_vc/train.parquet
    batch_size: 4
    shuffle: true
    num_workers: 4
    target_sr: 16000
    mono: true
    max_len: 64600
    base_transform:
    - type: pad
      max_len: 64600
      pad_type: repeat
      random_pad: true
  val:
    dataset_type: StandardDataset
    dataset_names:
    - ceb_pld
    parquet_files:
    - manifests/splits_vc/val.parquet
    batch_size: 16
    shuffle: false
    num_workers: 2
    target_sr: 16000
    mono: true
    max_len: 64600
    base_transform:
    - type: pad
      max_len: 64600
      pad_type: repeat
      random_pad: false
  test:
    dataset_type: StandardDataset
    dataset_names:
    - ceb_pld
    parquet_files:
    - manifests/splits_vc/test.parquet
    batch_size: 16
    shuffle: false
    num_workers: 0
    target_sr: 16000
    mono: true
    max_len: 64600
    base_transform:
    - type: pad
      max_len: 64600
      pad_type: repeat
      random_pad: false
model:
  type: StandardDetector
  frontend:
    type: wav2vec2
