# Formatting config for the ceb-deepfake-detect preprocessing scripts.
#
# Run from the project root, with the venv active:
#
#     pip install "black==26.3.1"
#     black .
#
# The version is pinned because `preview` / `enable-unstable-feature`
# settings below can change between Black releases. If you bump the
# version, re-run `black .` once and commit the result on its own
# commit so the reformat stays separate from real changes.

[tool.black]
line-length = 79
target-version = ["py311"]

# Lets Black split over-long string literals instead of leaving them
# hanging past the line limit.
preview = true
enable-unstable-feature = ["string_processing"]

extend-exclude = '''
/(
    venv
  | data
  | manifests
  | transcripts
  | transcripts_mms
  | elevenlabs-reference
  | \.git
)/
'''
